<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Totem SENAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.5s, color 0.5s; }
        
        /* Tema Claro */
        .tema-claro { background-color: #f3f4f6; color: #1f2937; }
        .tema-claro .bg-tabela { background-color: #ffffff; }
        .tema-claro .linha-impar { background-color: #f9fafb; }
        .tema-claro .texto-secundario { color: #4b5563; }
        .tema-claro .border-header { border-bottom: 4px solid #E3000F; }

        /* Tema Escuro */
        .tema-escuro .text-senai { color: #60A5FA; }
        .tema-escuro { background-color: #111827; color: #f3f4f6; }
        .tema-escuro .bg-tabela { background-color: #1f2937; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .tema-escuro .linha-impar { background-color: #374151; }
        .tema-escuro .texto-secundario { color: #d1d5db; }
        .tema-escuro .border-header { border-bottom: 4px solid #f87171; }
        .tema-escuro .bg-gray-800 { background-color: #0f172a; }

        .bg-senai { background-color: #005CAA; }
        .text-senai { color: #005CAA; }
        
        .pulse-dot { height: 12px; width: 12px; background-color: #10B981; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 8px #10B981; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        .linha-aula { animation: slideIn 0.5s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

        .dots-container { display: flex; justify-content: center; gap: 10px; margin-top: 16px; margin-bottom: 8px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; background-color: #cbd5e1; transition: all 0.3s ease; }
        .dot.active { background-color: #005CAA; transform: scale(1.3); }

        /* Letreiro do Rodapé */
        .rodape-container { 
            background-color: #005CAA; 
            color: white; 
            overflow: hidden; 
            white-space: nowrap; 
            padding: 20px 0; 
            font-size: 2rem; 
            font-weight: bold; 
            box-shadow: 0 -4px 10px rgba(0,0,0,0.2);
        }
        .rodape-texto { display: inline-block; padding-left: 100%; animation: letreiro 25s linear infinite; }
        @keyframes letreiro { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body id="corpo-pagina" class="h-screen w-screen overflow-hidden flex flex-col tema-claro">
    <header class="bg-senai text-white p-6 flex justify-between items-center shadow-lg z-10">
        <div class="flex items-center gap-6">
            <img src="SESISENAI.png" alt="Logo SESI SENAI" class="h-14 object-contain">
            <div class="text-2xl font-light border-l-2 pl-6 border-white">Rio Verde</div>
        </div>
        <div class="text-right flex flex-col items-end">
            <div id="relogio" class="text-4xl font-bold tracking-wider">00:00:00</div>
            <div id="data-atual" class="text-xl uppercase text-gray-200">Carregando...</div>
        </div>
    </header>

    <main class="flex-1 p-8 flex flex-col overflow-hidden">
        <div class="flex justify-between items-end mb-4 border-header pb-2">
            <h2 id="dia-semana-titulo" class="text-4xl font-bold tracking-tight">AULAS DE HOJE</h2>
            <div class="flex items-center text-sm font-semibold">
                <span class="pulse-dot" id="dot-sync"></span> <span id="status-sync">Sincronizado</span>
            </div>
        </div>
        
        <div class="bg-tabela rounded-xl shadow-2xl flex-1 flex flex-col overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-800 text-white text-xl uppercase tracking-wider">
                        <th class="p-4 pl-6 w-1/5">Escola/Evento</th>
                        <th class="p-4 w-1/4">Curso (Série)</th>
                        <th class="p-4 w-1/6">Instrutor(a)</th>
                        <th class="p-4 w-1/6">Ambiente</th>
                        <th class="p-4 text-center w-24">Início</th>
                        <th class="p-4 text-center w-24">Lanche</th>
                        <th class="p-4 text-center w-24 pr-6">Saída</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo" class="text-xl"></tbody>
            </table>
            <div id="paginacao" class="dots-container mt-auto pb-4"></div>
        </div>
    </main>

    <div id="rodape-area" class="rodape-container hidden">
        <div id="rodape-texto" class="rodape-texto"></div>
    </div>

    <script>
        // ======= COLE O NOVO LINK DO SCRIPT AQUI ========
        const API_URL = "https://script.google.com/macros/s/AKfycbzfUN_NmAWrHoFnRb_ooqXflq5hi7YIZgO1u00zl_bJviDwzfwlSrXo-P8vEwne3JggLQ/exec"; 
        // ================================================

        const diasDaSemana = ["DOMINGO", "SEGUNDA", "TERÇA", "QUARTA", "QUINTA", "SEXTA", "SÁBADO"];
        
        // Cache de Elementos DOM (Aumenta muito a velocidade na TV)
        const DOM = {
            corpoPagina: document.getElementById('corpo-pagina'),
            relogio: document.getElementById('relogio'),
            dataAtual: document.getElementById('data-atual'),
            tituloDia: document.getElementById('dia-semana-titulo'),
            statusSync: document.getElementById('status-sync'),
            dotSync: document.getElementById('dot-sync'),
            tabelaCorpo: document.getElementById('tabela-corpo'),
            paginacao: document.getElementById('paginacao'),
            areaRodape: document.getElementById('rodape-area'),
            textoRodape: document.getElementById('rodape-texto')
        };

        let dadosCompletos = {};
        let configAtual = {};
        let paginaAtual = 1;
        let totalPaginas = 1;
        let timerPaginacao;

        function atualizarRelogio() {
            const agora = new Date();
            DOM.relogio.innerText = agora.toLocaleTimeString('pt-BR');
            DOM.dataAtual.innerText = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
        }

        async function buscarDados() {
            if(!API_URL.startsWith("http")) return;
            try {
                const urlSemCache = `${API_URL}?t=${new Date().getTime()}`; 
                const resposta = await fetch(urlSemCache);
                dadosCompletos = await resposta.json();
                configAtual = dadosCompletos.configuracoes || {};
                
                // Lógica de F5 Remoto
                const f5Remoto = configAtual.forcarF5 ? configAtual.forcarF5.toString().trim() : "";
                const ultimoF5 = localStorage.getItem("ultimoF5") || "";
                if (f5Remoto !== "" && f5Remoto !== ultimoF5) {
                    localStorage.setItem("ultimoF5", f5Remoto);
                    window.location.reload(true); 
                    return; 
                }

                aplicarConfiguracoes();
                renderizarTabela();
            } catch (erro) {
                console.error("Erro na sincronização:", erro);
            }
        }

        function aplicarConfiguracoes() {
            // Tema
            const temaNovo = configAtual.modoTela === "ESCURO" ? 'tema-escuro' : 'tema-claro';
            const temaAntigo = configAtual.modoTela === "ESCURO" ? 'tema-claro' : 'tema-escuro';
            if (!DOM.corpoPagina.classList.contains(temaNovo)) {
                DOM.corpoPagina.classList.remove(temaAntigo);
                DOM.corpoPagina.classList.add(temaNovo);
            }

            // Rodapé
            if (configAtual.mensagemRodape && configAtual.mensagemRodape.trim() !== "") {
                if (DOM.textoRodape.innerText !== configAtual.mensagemRodape) {
                    DOM.textoRodape.innerText = configAtual.mensagemRodape;
                }
                DOM.areaRodape.classList.remove('hidden');
            } else {
                DOM.areaRodape.classList.add('hidden');
            }
        }

        function converterParaMinutos(horarioStr) {
            if (!horarioStr || horarioStr === "-") return 0;
            const partes = horarioStr.toLowerCase().replace('h', ':').trim().split(':');
            return (parseInt(partes[0]) || 0) * 60 + (parseInt(partes[1]) || 0);
        }

        function filtrarAulas(aulas) {
            const instFiltro = configAtual.filtroInstituicao || "MOSTRAR TUDO";
            let turnoFiltro = configAtual.filtroTurno || "MOSTRAR TUDO";
            
            if (turnoFiltro === "AUTOMÁTICO" || turnoFiltro === "AUTOMATICO") {
                const agora = new Date();
                const minAtuais = agora.getHours() * 60 + agora.getMinutes();
                if (minAtuais < 780) turnoFiltro = "MATUTINO";
                else if (minAtuais < 1080) turnoFiltro = "VESPERTINO";
                else turnoFiltro = "NOTURNO";
            }

            return aulas.filter(aula => {
                const instAula = aula.instituicao.toUpperCase();
                let passouInst = (instFiltro === "MOSTRAR TUDO" || instFiltro === "TODOS" || instAula === instFiltro);
                if (instFiltro === "SENAI") passouInst = (instAula === "SENAI" || instAula === "SEDUC");

                const minAula = converterParaMinutos(aula.inicio);
                let passouTurno = true;
                if (turnoFiltro === "MATUTINO") passouTurno = (minAula >= 360 && minAula <= 750);
                else if (turnoFiltro === "VESPERTINO") passouTurno = (minAula >= 780 && minAula <= 1070);
                else if (turnoFiltro === "NOTURNO") passouTurno = (minAula >= 1080 && minAula <= 1380);

                return passouInst && passouTurno;
            });
        }

        function renderizarTabela() {
            let hoje = new Date().getDay();
            if (hoje === 0) hoje = 1; 
            let nomeDia = diasDaSemana[hoje];
            
            // Modo Teste
            if (configAtual.modoTeste && configAtual.modoTeste !== "DESLIGADO") {
                nomeDia = configAtual.modoTeste.toUpperCase(); 
                DOM.statusSync.innerHTML = `<span style="color: #F59E0B; font-weight: 800;">⚠️ MODO TESTE (${nomeDia})</span>`;
                DOM.dotSync.style.backgroundColor = "#F59E0B"; 
                DOM.dotSync.style.boxShadow = "0 0 8px #F59E0B";
            } else {
                DOM.statusSync.innerHTML = "Sincronizado ao vivo";
                DOM.dotSync.style.backgroundColor = "#10B981"; 
                DOM.dotSync.style.boxShadow = "0 0 8px #10B981";
            }

            const aulasBrutas = dadosCompletos[nomeDia] || [];
            const aulas = filtrarAulas(aulasBrutas);

            if (aulas.length === 0) {
                DOM.tituloDia.innerText = `AULAS DE HOJE - ${nomeDia}`;
                DOM.tabelaCorpo.innerHTML = `<tr><td colspan="7" class="p-8 text-center texto-secundario text-2xl font-medium">Nenhuma aula encontrada para os filtros atuais.</td></tr>`;
                DOM.paginacao.innerHTML = "";
                clearTimeout(timerPaginacao);
                return;
            }

            const limitesPorTela = parseInt(configAtual.turmasPorTela) || 6;
            const tempoTelaMs = (parseInt(configAtual.tempoPorTela) || 5) * 1000;
            totalPaginas = Math.ceil(aulas.length / limitesPorTela);
            
            if (paginaAtual > totalPaginas) paginaAtual = 1;

            DOM.tituloDia.innerText = totalPaginas > 1 ? 
                `AULAS DE HOJE - ${nomeDia} (Página ${paginaAtual}/${totalPaginas})` : `AULAS DE HOJE - ${nomeDia}`;

            const indiceInicio = (paginaAtual - 1) * limitesPorTela;
            const aulasDaPagina = aulas.slice(indiceInicio, indiceInicio + limitesPorTela);

            // Virtual DOM: Só desenha na tela se o código HTML gerado for diferente do atual
            const novoHtmlCorpo = aulasDaPagina.map((aula, index) => `
                <tr class="border-b border-gray-400 linha-aula ${index % 2 === 0 ? 'linha-impar' : 'bg-transparent'}" style="animation-delay: ${index * 0.05}s;">
                    <td class="p-4 pl-6 font-bold">${aula.escola}</td>
                    <td class="p-4"><span class="font-bold text-senai">${aula.curso}</span> <span class="text-sm bg-gray-300 text-gray-800 px-2 py-1 rounded ml-2 font-bold">${aula.serie}</span></td>
                    <td class="p-4 font-medium uppercase text-sm">${aula.instrutor}</td>
                    <td class="p-4 font-medium texto-secundario text-sm">${aula.ambiente}</td>
                    <td class="p-4 text-center font-bold text-blue-500">${aula.inicio}</td>
                    <td class="p-4 text-center font-bold text-green-500">${aula.lanche}</td>
                    <td class="p-4 text-center font-bold text-red-500 pr-6">${aula.saida}</td>
                </tr>`).join('');

            // Otimização: A tela só pisca se a informação realmente mudou
            if (DOM.tabelaCorpo.innerHTML !== novoHtmlCorpo) {
                DOM.tabelaCorpo.innerHTML = novoHtmlCorpo;
            }

            // Renderiza bolinhas
            let novoHtmlPaginacao = "";
            if (totalPaginas > 1) {
                for (let i = 1; i <= totalPaginas; i++) {
                    novoHtmlPaginacao += `<div class="dot ${i === paginaAtual ? 'active' : ''}"></div>`;
                }
            }
            if (DOM.paginacao.innerHTML !== novoHtmlPaginacao) {
                DOM.paginacao.innerHTML = novoHtmlPaginacao;
            }

            clearTimeout(timerPaginacao);
            if (totalPaginas > 1) {
                timerPaginacao = setTimeout(() => {
                    paginaAtual = paginaAtual >= totalPaginas ? 1 : paginaAtual + 1;
                    renderizarTabela();
                }, tempoTelaMs);
            }
        }

        // Inicialização
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        if (API_URL.startsWith("http")) {
            buscarDados();
            setInterval(buscarDados, 60000); // Consulta silenciosa a cada 60s
        }
    </script>
</body>
</html>
