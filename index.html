<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Totem SENAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.5s, color 0.5s; }
        
        /* Tema Claro */
        .tema-claro { background-color: #f3f4f6; color: #1f2937; }
        .tema-claro .bg-tabela { background-color: #ffffff; }
        .tema-claro .linha-impar { background-color: #f9fafb; }
        .tema-claro .texto-secundario { color: #4b5563; }
        .tema-claro .border-header { border-bottom: 4px solid #E3000F; }

        /* Tema Escuro */
        .tema-escuro .text-senai { color: #60A5FA; }
        .tema-escuro { background-color: #111827; color: #f3f4f6; }
        .tema-escuro .bg-tabela { background-color: #1f2937; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .tema-escuro .linha-impar { background-color: #374151; }
        .tema-escuro .texto-secundario { color: #d1d5db; }
        .tema-escuro .border-header { border-bottom: 4px solid #f87171; }
        .tema-escuro .bg-gray-800 { background-color: #0f172a; }

        .bg-senai { background-color: #005CAA; }
        .text-senai { color: #005CAA; }
        
        .pulse-dot { height: 12px; width: 12px; background-color: #10B981; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 8px #10B981; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        .linha-aula { animation: slideIn 0.5s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

        .dots-container { display: flex; justify-content: center; gap: 10px; margin-top: 16px; margin-bottom: 8px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; background-color: #cbd5e1; transition: all 0.3s ease; }
        .dot.active { background-color: #005CAA; transform: scale(1.3); }

        /* Letreiro do Rodapé (Atualizado para Azul, Maior e mais Largo) */
        .rodape-container { 
            background-color: #005CAA; 
            color: white; 
            overflow: hidden; 
            white-space: nowrap; 
            padding: 20px 0; 
            font-size: 2rem; 
            font-weight: bold; 
            box-shadow: 0 -4px 10px rgba(0,0,0,0.2);
        }
        .rodape-texto { display: inline-block; padding-left: 100%; animation: letreiro 25s linear infinite; }
        @keyframes letreiro { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body id="corpo-pagina" class="h-screen w-screen overflow-hidden flex flex-col tema-claro">
    <header class="bg-senai text-white p-6 flex justify-between items-center shadow-lg z-10">
        <div class="flex items-center gap-4">
            <div class="text-2xl font-black tracking-wider">UNIDADE INTEGRADA SESI SENAI</div>
            <div id="cabecalho-texto" class="text-2xl font-light border-l-2 pl-4 border-white">Rio Verde</div>
        </div>
        <div class="text-right flex flex-col items-end">
            <div id="relogio" class="text-4xl font-bold tracking-wider">00:00:00</div>
            <div id="data-atual" class="text-xl uppercase text-gray-200">Carregando...</div>
        </div>
    </header>

    <main class="flex-1 p-8 flex flex-col overflow-hidden">
        <div class="flex justify-between items-end mb-4 border-header pb-2">
            <h2 id="dia-semana-titulo" class="text-4xl font-bold tracking-tight">AULAS DE HOJE</h2>
            <div class="flex items-center text-sm font-semibold">
                <span class="pulse-dot" id="dot-sync"></span> <span id="status-sync">Sincronizado ao vivo</span>
            </div>
        </div>
        
        <div class="bg-tabela rounded-xl shadow-2xl flex-1 flex flex-col overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-800 text-white text-xl uppercase tracking-wider">
                        <th class="p-4 pl-6 w-1/5">Escola/Evento</th>
                        <th class="p-4 w-1/4">Curso (Série)</th>
                        <th class="p-4 w-1/6">Instrutor(a)</th>
                        <th class="p-4 w-1/6">Ambiente</th>
                        <th class="p-4 text-center w-24">Início</th>
                        <th class="p-4 text-center w-24">Lanche</th>
                        <th class="p-4 text-center w-24 pr-6">Saída</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo" class="text-xl"></tbody>
            </table>
            <div id="paginacao" class="dots-container mt-auto pb-4"></div>
        </div>
    </main>

    <!-- Rodapé Animado -->
    <div id="rodape-area" class="rodape-container hidden">
        <div id="rodape-texto" class="rodape-texto"></div>
    </div>

    <script>
        // ======= COLE SUA NOVA URL NA LINHA ABAIXO =======
        const API_URL = "https://script.google.com/macros/s/AKfycbwGrZn8fEEbekPtAolW2pwA_GrtQM_g4nmOClnWqJbla7VEgPPaweW7M_QY2HQ2fqqH1A/exec"; 
        // =================================================

        const diasDaSemana = ["DOMINGO", "SEGUNDA", "TERÇA", "QUARTA", "QUINTA", "SEXTA", "SÁBADO"];
        let dadosCompletos = {};
        let configAtual = {};
        let paginaAtual = 1;
        let totalPaginas = 1;
        let timerPaginacao;

        function atualizarRelogio() {
            const agora = new Date();
            document.getElementById('relogio').innerText = agora.toLocaleTimeString('pt-BR');
            document.getElementById('data-atual').innerText = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
        }

        async function buscarDados() {
            if(!API_URL.startsWith("http")) return;
            try {
                const resposta = await fetch(API_URL);
                dadosCompletos = await resposta.json();
                configAtual = dadosCompletos.configuracoes || {};
                
                // --- LÓGICA DO F5 REMOTO ---
                const f5Remoto = configAtual.forcarF5 || "";
                const ultimoF5 = localStorage.getItem("ultimoF5") || "";
                if (f5Remoto !== "" && f5Remoto !== ultimoF5) {
                    localStorage.setItem("ultimoF5", f5Remoto);
                    window.location.reload(true); // Dá o F5 na tela
                    return; 
                }
                // ---------------------------

                paginaAtual = 1; 
                aplicarConfiguracoes();
                renderizarTabela();
            } catch (erro) {
                console.error("Erro na sincronização:", erro);
            }
        }

        function aplicarConfiguracoes() {
            const corpo = document.getElementById('corpo-pagina');
            if (configAtual.modoTela === "ESCURO") {
                corpo.classList.remove('tema-claro');
                corpo.classList.add('tema-escuro');
            } else {
                corpo.classList.remove('tema-escuro');
                corpo.classList.add('tema-claro');
            }

            const areaRodape = document.getElementById('rodape-area');
            const textoRodape = document.getElementById('rodape-texto');
            if (configAtual.mensagemRodape && configAtual.mensagemRodape.trim() !== "") {
                textoRodape.innerText = configAtual.mensagemRodape;
                areaRodape.classList.remove('hidden');
            } else {
                areaRodape.classList.add('hidden');
            }
        }

        function converterParaMinutos(horarioStr) {
            if (!horarioStr || horarioStr === "-") return 0;
            let limpo = horarioStr.toLowerCase().replace('h', ':').trim();
            let partes = limpo.split(':');
            let h = parseInt(partes[0]) || 0;
            let m = parseInt(partes[1]) || 0;
            return (h * 60) + m;
        }

        function filtrarAulas(aulas) {
            return aulas.filter(aula => {
                let instFiltro = configAtual.filtroInstituicao || "MOSTRAR TUDO";
                let instAula = aula.instituicao.toUpperCase();
                
                let passouInstituicao = true;
                if (instFiltro === "SENAI") {
                    passouInstituicao = (instAula === "SENAI" || instAula === "SEDUC");
                } else if (instFiltro !== "MOSTRAR TUDO" && instFiltro !== "TODOS") {
                    passouInstituicao = (instAula === instFiltro);
                }

                let turnoFiltro = configAtual.filtroTurno || "MOSTRAR TUDO";
                
                // --- NOVA LÓGICA DO MODO AUTOMÁTICO ---
                if (turnoFiltro === "AUTOMÁTICO" || turnoFiltro === "AUTOMATICO") {
                    const agora = new Date();
                    const minutosAtuais = (agora.getHours() * 60) + agora.getMinutes();
                    
                    if (minutosAtuais < 780) { // Antes das 13h00
                        turnoFiltro = "MATUTINO";
                    } else if (minutosAtuais < 1080) { // Entre 13h00 e 17h59
                        turnoFiltro = "VESPERTINO";
                    } else { // Depois das 18h00
                        turnoFiltro = "NOTURNO";
                    }
                }
                // --------------------------------------

                let minutos = converterParaMinutos(aula.inicio);
                let passouTurno = true;
                
                if (turnoFiltro === "MATUTINO") {
                    passouTurno = (minutos >= 360 && minutos <= 750); // Aulas das 06:00 às 12:30
                } else if (turnoFiltro === "VESPERTINO") {
                    passouTurno = (minutos >= 780 && minutos <= 1070); // Aulas das 13:00 às 17:50
                } else if (turnoFiltro === "NOTURNO") {
                    passouTurno = (minutos >= 1080 && minutos <= 1380); // Aulas das 18:00 às 23:00
                }

                return passouInstituicao && passouTurno;
            });
        }

        function renderizarTabela() {
            let hoje = new Date().getDay();
            if (hoje === 0 || hoje === 6) hoje = 1; 
            let nomeDia = diasDaSemana[hoje];
            
            // --- NOVA LÓGICA DO MODO DE TESTE ---
            const statusSync = document.getElementById('status-sync');
            const dotSync = document.getElementById('dot-sync');
            
            if (configAtual.modoTeste && configAtual.modoTeste !== "DESLIGADO" && configAtual.modoTeste !== "") {
                nomeDia = configAtual.modoTeste; 
                statusSync.innerHTML = `<span style="color: #F59E0B; font-weight: 800;">⚠️ MODO TESTE (${nomeDia})</span>`;
                dotSync.style.backgroundColor = "#F59E0B"; 
                dotSync.style.boxShadow = "0 0 8px #F59E0B";
            } else {
                statusSync.innerHTML = "Sincronizado ao vivo";
                dotSync.style.backgroundColor = "#10B981"; 
                dotSync.style.boxShadow = "0 0 8px #10B981";
            }
            // ------------------------------------

            let aulasBrutas = dadosCompletos[nomeDia] || [];
            let aulas = filtrarAulas(aulasBrutas);
            
            const corpo = document.getElementById('tabela-corpo');
            const paginacao = document.getElementById('paginacao');
            corpo.innerHTML = ""; paginacao.innerHTML = "";

            if (aulas.length === 0) {
                document.getElementById('dia-semana-titulo').innerText = `AULAS DE HOJE - ${nomeDia}`;
                corpo.innerHTML = `<tr><td colspan="7" class="p-8 text-center texto-secundario text-2xl font-medium">Nenhuma aula encontrada para os filtros atuais.</td></tr>`;
                clearInterval(timerPaginacao);
                return;
            }

            let limitesPorTela = configAtual.turmasPorTela || 6;
            let tempoTelaMs = (configAtual.tempoPorTela || 5) * 1000;
            totalPaginas = Math.ceil(aulas.length / limitesPorTela);
            
            document.getElementById('dia-semana-titulo').innerText = totalPaginas > 1 ? 
                `AULAS DE HOJE - ${nomeDia} (Página ${paginaAtual}/${totalPaginas})` : `AULAS DE HOJE - ${nomeDia}`;

            const indiceInicio = (paginaAtual - 1) * limitesPorTela;
            const aulasDaPagina = aulas.slice(indiceInicio, indiceInicio + limitesPorTela);

            aulasDaPagina.forEach((aula, index) => {
                const tr = document.createElement('tr');
                tr.className = `border-b border-gray-400 linha-aula ${index % 2 === 0 ? 'linha-impar' : 'bg-transparent'}`;
                tr.style.animationDelay = `${index * 0.05}s`;

                tr.innerHTML = `
                    <td class="p-4 pl-6 font-bold">${aula.escola}</td>
                    <td class="p-4"><span class="font-bold text-senai">${aula.curso}</span> <span class="text-sm bg-gray-300 text-gray-800 px-2 py-1 rounded ml-2 font-bold">${aula.serie}</span></td>
                    <td class="p-4 font-medium uppercase text-sm">${aula.instrutor}</td>
                    <td class="p-4 font-medium texto-secundario text-sm">${aula.ambiente}</td>
                    <td class="p-4 text-center font-bold text-blue-500">${aula.inicio}</td>
                    <td class="p-4 text-center font-bold text-green-500">${aula.lanche}</td>
                    <td class="p-4 text-center font-bold text-red-500 pr-6">${aula.saida}</td>
                `;
                corpo.appendChild(tr);
            });

            if (totalPaginas > 1) {
                for (let i = 1; i <= totalPaginas; i++) {
                    const bolinha = document.createElement('div');
                    bolinha.className = `dot ${i === paginaAtual ? 'active' : ''}`;
                    paginacao.appendChild(bolinha);
                }
            }

            clearInterval(timerPaginacao);
            if (totalPaginas > 1) {
                timerPaginacao = setInterval(mudarPagina, tempoTelaMs);
            }
        }

        function mudarPagina() {
            paginaAtual = paginaAtual >= totalPaginas ? 1 : paginaAtual + 1;
            renderizarTabela();
        }

        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        if (API_URL.startsWith("http")) {
            buscarDados();
            setInterval(buscarDados, 300000); 
        } else {
            document.getElementById('tabela-corpo').innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-600 text-2xl font-bold">⚠️ Atenção: Não esqueça de colar a nova URL do Apps Script!</td></tr>`;
        }
    </script>
</body>
</html>
