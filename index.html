<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Totem SEDUC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .bg-senai { background-color: #005CAA; }
        .text-senai { color: #005CAA; }
        .border-red-senai { border-color: #E3000F; }
        
        .pulse-dot {
            height: 12px; width: 12px; background-color: #10B981; border-radius: 50%;
            display: inline-block; margin-right: 8px; box-shadow: 0 0 8px #10B981;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        .linha-aula { animation: slideIn 0.5s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

        /* Estilos das bolinhas de paginação */
        .dots-container { display: flex; justify-content: center; gap: 10px; margin-top: 16px; margin-bottom: 8px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; background-color: #cbd5e1; transition: all 0.3s ease; }
        .dot.active { background-color: #005CAA; transform: scale(1.3); }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">
    <!-- Cabeçalho -->
    <header class="bg-senai text-white p-6 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-4">
            <div class="text-4xl font-black tracking-wider">SENAI</div>
            <div class="text-2xl font-light border-l-2 pl-4 border-white">Cronograma de Aulas - SENAI Fernando Bezerra</div>
        </div>
        <div class="text-right flex flex-col items-end">
            <div id="relogio" class="text-4xl font-bold tracking-wider">00:00:00</div>
            <div id="data-atual" class="text-xl uppercase text-gray-200">Carregando...</div>
        </div>
    </header>

    <!-- Conteúdo Central -->
    <main class="flex-1 p-8 flex flex-col">
        <div class="flex justify-between items-end mb-4 border-b-4 border-red-senai pb-2">
            <h2 id="dia-semana-titulo" class="text-4xl font-bold text-senai tracking-tight">AULAS DE HOJE</h2>
            <div class="flex items-center text-sm font-semibold text-gray-500">
                <span class="pulse-dot"></span> Sincronizado ao vivo
            </div>
        </div>
        
        <div class="bg-white rounded-xl shadow-2xl flex-1 flex flex-col overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-800 text-white text-xl uppercase tracking-wider">
                        <th class="p-4 pl-6 w-1/5">Escola</th>
                        <th class="p-4 w-1/4">Curso (Série)</th>
                        <th class="p-4 w-1/6">Instrutor(a)</th>
                        <th class="p-4 w-1/6">Ambiente</th>
                        <th class="p-4 text-center w-24">Início</th> <!-- NOVA COLUNA -->
                        <th class="p-4 text-center w-24">Lanche</th>
                        <th class="p-4 text-center w-24 pr-6">Saída</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo" class="text-xl">
                    <!-- Linhas preenchidas pelo robô automaticamente -->
                </tbody>
            </table>
            <!-- Contêiner das bolinhas de paginação no final da tabela -->
            <div id="paginacao" class="dots-container mt-auto pb-4"></div>
        </div>
    </main>

    <script>
        // ======= COLE SUA NOVA URL NA LINHA ABAIXO =======
        const API_URL = "https://script.google.com/macros/s/AKfycbykaOhK6tIU7mdMYSU-IVCu4BLHJYiepmuC7_z6ApxCMC1qtjJkBIBy7TJ_o4V82puMcg/exec"; 
        // =================================================

        const diasDaSemana = ["DOMINGO", "SEGUNDA", "TERÇA", "QUARTA", "QUINTA", "SEXTA", "SÁBADO"];
        let dadosCompletos = {};

        // === CONFIGURAÇÕES DA PÁGINA ===
        const LINHAS_POR_PAGINA = 8;        // Quantidade de turmas por tela
        const TEMPO_POR_PAGINA_MS = 10000;  // 10000 = 10 segundos por tela
        let paginaAtual = 1;
        let totalPaginas = 1;
        let timerPaginacao;

        function atualizarRelogio() {
            const agora = new Date();
            document.getElementById('relogio').innerText = agora.toLocaleTimeString('pt-BR');
            const opcoesData = { weekday: 'long', day: '2-digit', month: 'long' };
            document.getElementById('data-atual').innerText = agora.toLocaleDateString('pt-BR', opcoesData);
        }

        async function buscarDados() {
            if(!API_URL.startsWith("http")) return;
            try {
                const resposta = await fetch(API_URL);
                dadosCompletos = await resposta.json();
                paginaAtual = 1; // Reseta para a primeira página quando baixar dados novos
                renderizarTabela();
            } catch (erro) {
                console.error("Erro ao sincronizar com a planilha:", erro);
            }
        }

        function renderizarTabela() {
            let hoje = new Date().getDay();
            if (hoje === 0 || hoje === 6) hoje = 1; 
            
            const nomeDia = diasDaSemana[hoje];
            const aulas = dadosCompletos[nomeDia] || [];
            
            const corpo = document.getElementById('tabela-corpo');
            const paginacao = document.getElementById('paginacao');
            corpo.innerHTML = ""; 
            paginacao.innerHTML = "";

            if (aulas.length === 0) {
                document.getElementById('dia-semana-titulo').innerText = `AULAS DE HOJE - ${nomeDia}`;
                corpo.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-gray-500 text-2xl font-medium">Nenhuma aula encontrada para o dia de hoje.</td></tr>`;
                clearInterval(timerPaginacao);
                return;
            }

            // Calcula quantas páginas existem
            totalPaginas = Math.ceil(aulas.length / LINHAS_POR_PAGINA);
            
            if (totalPaginas > 1) {
                document.getElementById('dia-semana-titulo').innerText = `AULAS DE HOJE - ${nomeDia} (Página ${paginaAtual}/${totalPaginas})`;
            } else {
                document.getElementById('dia-semana-titulo').innerText = `AULAS DE HOJE - ${nomeDia}`;
            }

            // Recorta apenas os dados da página que estamos olhando agora
            const indiceInicio = (paginaAtual - 1) * LINHAS_POR_PAGINA;
            const indiceFim = indiceInicio + LINHAS_POR_PAGINA;
            const aulasDaPagina = aulas.slice(indiceInicio, indiceFim);

            aulasDaPagina.forEach((aula, index) => {
                const tr = document.createElement('tr');
                tr.className = `border-b border-gray-200 linha-aula ${index % 2 === 0 ? 'bg-gray-50' : 'bg-white'}`;
                tr.style.animationDelay = `${index * 0.05}s`;

                tr.innerHTML = `
                    <td class="p-4 pl-6 font-bold text-gray-800">${aula.escola}</td>
                    <td class="p-4"><span class="text-senai font-bold">${aula.curso}</span> <span class="text-sm bg-gray-200 text-gray-700 px-2 py-1 rounded ml-2 font-bold">${aula.serie}</span></td>
                    <td class="p-4 font-medium uppercase text-sm">${aula.instrutor}</td>
                    <td class="p-4 font-medium text-gray-700 text-sm">${aula.ambiente}</td>
                    <td class="p-4 text-center font-bold text-blue-600">${aula.inicio}</td>
                    <td class="p-4 text-center font-bold text-green-600">${aula.lanche}</td>
                    <td class="p-4 text-center font-bold text-red-600 pr-6">${aula.saida}</td>
                `;
                corpo.appendChild(tr);
            });

            // Cria as bolinhas de paginação na parte de baixo da tela
            if (totalPaginas > 1) {
                for (let i = 1; i <= totalPaginas; i++) {
                    const bolinha = document.createElement('div');
                    bolinha.className = `dot ${i === paginaAtual ? 'active' : ''}`;
                    paginacao.appendChild(bolinha);
                }
            }

            // Reinicia o cronômetro para mudar de página
            clearInterval(timerPaginacao);
            if (totalPaginas > 1) {
                timerPaginacao = setInterval(mudarPagina, TEMPO_POR_PAGINA_MS);
            }
        }

        function mudarPagina() {
            paginaAtual++;
            if (paginaAtual > totalPaginas) {
                paginaAtual = 1; // Volta para a primeira tela
            }
            renderizarTabela();
        }

        // Relógio roda a cada segundo
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        // O robô de buscas: de 5 em 5 minutos
        if (API_URL.startsWith("http")) {
            buscarDados();
            setInterval(buscarDados, 300000); 
            
            // Checa à meia-noite se o dia virou
            setInterval(() => {
                const h = new Date().getHours();
                const m = new Date().getMinutes();
                if (h === 0 && m === 0) buscarDados();
            }, 60000);
        } else {
            document.getElementById('tabela-corpo').innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-600 text-2xl font-bold">⚠️ Atenção: Não esqueça de colar a nova URL do Apps Script dentro do arquivo HTML!</td></tr>`;
        }
    </script>
</body>
</html>
